<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>RaidSphere Overlay</title>
  </head>
  <body>
    <main id="app" aria-label="RaidSphere overlay">
      <div class="stars" aria-hidden="true"></div>
      <div id="globe" aria-hidden="true"></div>
      <p class="badge">Simulation</p>
      <section class="location-panel" aria-label="Country location">
        <button id="locate-country" type="button">Locate my country</button>
        <p id="location-status">Optional · processed only in this browser</p>
      </section>
      <section class="translations" aria-label="Chat translations">
        <p id="translation-window" class="translation-window" hidden></p>
        <ol id="bubbles" class="bubbles" aria-live="polite"></ol>
      </section>
      <section class="status" aria-live="polite">
        <p class="brand">RaidSphere</p>
        <h1 id="headline">Raids without language barriers</h1>
        <p id="detail"></p>
        <p id="connection-status">Starting.</p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
